# Environment values and database setup: docs/deployment.md
services:
  - type: web
    name: fridge-ingredients
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SUPABASE_DB_ENABLED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

